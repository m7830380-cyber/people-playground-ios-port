name: One-off - copy CI secrets to the ICS2 port repo
on: workflow_dispatch
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          V_LICENSE: ${{ secrets.UNITY_LICENSE }}
          V_EMAIL: ${{ secrets.UNITY_EMAIL }}
          V_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          V_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          R=m7830380-cyber/ics2-ios-port
          printf '%s' "$V_LICENSE"  | gh secret set UNITY_LICENSE --repo $R
          printf '%s' "$V_EMAIL"    | gh secret set UNITY_EMAIL --repo $R
          printf '%s' "$V_PASSWORD" | gh secret set UNITY_PASSWORD --repo $R
          printf '%s' "$V_TOKEN"    | gh secret set PRIVATE_REPO_TOKEN --repo $R
          gh secret list --repo $R
