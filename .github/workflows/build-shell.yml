name: Build iOS shell IPA

# Builds the IL2CPP player (Unity 2020.3.1f1, the game's exact version) that contains the patched game
# assemblies from the private repo (m7830380-cyber/ppg-ios-private). Game data is injected afterwards on
# the PC by tools/package_ipa.py. Because the result contains compiled game code, the IPA is published
# as a release of the PRIVATE repo, never as an artifact or release of this public one.

on:
  push:
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/build-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 2020.3.1f1
  PRIVATE_REPO: m7830380-cyber/ppg-ios-private

jobs:
  shell:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Get patched game assemblies (private repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Place plugins
        run: |
          set -euo pipefail
          mkdir -p shell/Assets/Plugins
          rm -rf shell/Assets/Plugins/Game
          cp -R private/Plugins shell/Assets/Plugins/Game
          ls shell/Assets/Plugins/Game | grep -c '\.dll$'

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      # Unity 2020.3.1f1 has no Apple-silicon editor (Unity Hub / game-ci fail with "Missing [Unity] section"),
      # so install the Intel editor + iOS module directly and run it under Rosetta. Cached between runs
      # (only Unity itself is cached - nothing from the game).
      - name: Restore Unity install
        id: unity-cache
        uses: actions/cache/restore@v4
        with:
          path: /Applications/Unity
          key: unity-2020.3.1f1-ios-x64-v1

      - name: Install Unity ${{ env.UNITY_VERSION }} (Intel, Rosetta)
        if: steps.unity-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE=https://download.unity3d.com/download_unity/77a89f25062f
          curl -fsSL --retry 3 -o /tmp/editor.pkg "$BASE/MacEditorInstaller/Unity-2020.3.1f1.pkg" &
          curl -fsSL --retry 3 -o /tmp/ios.pkg "$BASE/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2020.3.1f1.pkg" &
          wait
          sudo installer -pkg /tmp/editor.pkg -target /
          sudo installer -pkg /tmp/ios.pkg -target /
          rm -f /tmp/editor.pkg /tmp/ios.pkg
          sudo chown -R "$(whoami)" /Applications/Unity

      - name: Save Unity install
        if: steps.unity-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/Unity
          key: unity-2020.3.1f1-ios-x64-v1

      - name: Check Unity
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          ls /Applications/Unity/PlaybackEngines
          file /Applications/Unity/Unity.app/Contents/MacOS/Unity

      # The .ulf is bound to the machine it was made on, so activate this runner with the serial inside it
      # (what game-ci does on macOS) and return the seat afterwards.
      - name: Activate Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          SERIAL=$(printf '%s' "$UNITY_LICENSE" | python3 -c "import sys,re,base64; d=re.search(r'<DeveloperData Value=\"([^\"]+)\"',sys.stdin.read()).group(1); print(base64.b64decode(d)[4:].decode())")
          [ -n "$SERIAL" ] || { echo "could not read the serial from UNITY_LICENSE"; exit 1; }
          echo "::add-mask::$SERIAL"
          echo "serial length ${#SERIAL}"
          mkdir -p /tmp/activate-project
          for attempt in 1 2 3; do
            arch -x86_64 /Applications/Unity/Unity.app/Contents/MacOS/Unity -batchmode -nographics -quit -logFile /tmp/activate.log               -serial "$SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /tmp/activate-project
            rc=$?
            echo "attempt $attempt: exit code $rc"
            tail -n 80 /tmp/activate.log
            # the placeholder project makes batchmode "fail" after activating; the license line is what counts
            if grep -qE "License activated successfully|license is already valid and activated" /tmp/activate.log; then rc=0; break; fi
            sleep 20
          done
          for f in ~/Library/Logs/Unity/Unity.Licensing.Client.log ~/Library/Logs/Unity/Unity.Entitlements.Audit.log; do
            [ -f "$f" ] && { echo "== $f"; tail -n 40 "$f"; }
          done
          ls -la "/Library/Application Support/Unity" 2>/dev/null
          exit $rc

      - name: Unity build (Xcode project)
        env:
          SHELL_OUT: ${{ github.workspace }}/xcode
        run: |
          set +e
          arch -x86_64 /Applications/Unity/Unity.app/Contents/MacOS/Unity -batchmode -nographics -quit -logFile "$PWD/unity.log"             -projectPath "$PWD/shell" -buildTarget iOS -executeMethod IosShellBuild.Build
          rc=$?
          grep -iE "error|exception|\[PPG" unity.log | grep -v "^UnityEngine" | head -n 150 || true
          tail -n 60 unity.log
          [ -f xcode/Unity-iPhone.xcodeproj/project.pbxproj ] || { echo "no Xcode project produced"; exit 1; }
          exit $rc

      - name: Return Unity license
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          [ -x /Applications/Unity/Unity.app/Contents/MacOS/Unity ] || exit 0
          arch -x86_64 /Applications/Unity/Unity.app/Contents/MacOS/Unity -batchmode -nographics -quit -logFile -             -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" 2>&1 | grep -iE "licens|return" | head -n 20 || true

      - name: Xcode build (unsigned)
        run: |
          set -euo pipefail
          cd xcode
          set +e
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -derivedDataPath "$PWD/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO build > xcodebuild.log 2>&1
          rc=$?
          set -e
          grep -E "error:|\*\* BUILD" xcodebuild.log | head -n 80 || true
          tail -n 40 xcodebuild.log
          exit $rc

      - name: Package shell IPA
        run: |
          set -euo pipefail
          APP="$(find xcode/dd -name '*.app' -path '*Release-iphoneos*' | head -n 1)"
          echo "app: $APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry PPG-shell.ipa Payload
          ls -lh PPG-shell.ipa

      - name: Publish release (private repo)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG=shell-latest
          NOTES="Shell IPA (no game data) from public run ${{ github.run_number }} / ${{ github.sha }}, plugins $(git -C private rev-parse --short HEAD)"
          if gh release view "$TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" PPG-shell.ipa --clobber --repo "$PRIVATE_REPO"
            gh release edit "$TAG" --notes "$NOTES" --repo "$PRIVATE_REPO"
          else
            gh release create "$TAG" PPG-shell.ipa --title "iOS shell (no game data)" --notes "$NOTES" --prerelease --repo "$PRIVATE_REPO"
          fi
